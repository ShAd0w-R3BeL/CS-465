<div class="card h-100">
  <img
    class="card-img-top"
    [src]="'/images/' + trip.image"
    [alt]="trip.name"
  >

  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>

    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-text">
      {{ trip.length }}<br>
      {{ trip.perPerson | currency:'USD':'symbol' }} per person
    </p>

    <p class="card-text">
      {{ trip.description }}
    </p>

    <button
      class="btn btn-secondary"
      type="button"
      (click)="editTrip(trip)"
    >
      Edit Trip
    </button>
  </div>
</div>
